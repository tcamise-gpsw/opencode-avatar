name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.7
        with:
          token: ${{ secrets.PR_CREATION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
