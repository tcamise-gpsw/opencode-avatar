<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 46" shape-rendering="crispEdges" aria-label="OpenCode Avatar robots showing all seven states">
  <defs>
    <g id="b">
      <!-- Antenna -->
      <rect x="15" y="0" width="2" height="4" fill="#4ade80"/>
      <rect x="14" y="0" width="4" height="2" fill="#4ade80"/>
      <!-- Head -->
      <rect x="8" y="4" width="16" height="12" fill="#334155"/>
      <rect x="9" y="5" width="14" height="10" fill="#64748b"/>
      <rect x="10" y="6" width="12" height="8" fill="#475569"/>
      <rect x="11" y="7" width="10" height="6" fill="#0f172a"/>
      <!-- Torso -->
      <rect x="10" y="18" width="12" height="8" fill="#334155"/>
      <rect x="11" y="19" width="10" height="6" fill="#64748b"/>
      <!-- LEDs -->
      <rect x="13" y="20" width="2" height="2" fill="#4ade80"/>
      <rect x="16" y="20" width="2" height="2" fill="#facc15"/>
      <rect x="19" y="20" width="2" height="2" fill="#f87171"/>
      <rect x="15" y="23" width="2" height="1" fill="#f97316"/>
      <!-- Arms -->
      <rect x="5" y="18" width="4" height="2" fill="#334155"/>
      <rect x="23" y="18" width="4" height="2" fill="#334155"/>
      <rect x="6" y="20" width="3" height="4" fill="#64748b"/>
      <rect x="23" y="20" width="3" height="4" fill="#64748b"/>
      <!-- Legs -->
      <rect x="12" y="27" width="3" height="4" fill="#334155"/>
      <rect x="18" y="27" width="3" height="4" fill="#334155"/>
      <rect x="10" y="30" width="5" height="2" fill="#64748b"/>
      <rect x="17" y="30" width="5" height="2" fill="#64748b"/>
    </g>
  </defs>

  <!-- idle (sleeping) -->
  <g transform="translate(19,0)">
    <use href="#b"/>
    <rect x="11" y="8" width="3" height="1" fill="#94a3b8"/>
    <rect x="18" y="8" width="3" height="1" fill="#94a3b8"/>
    <rect x="20" y="5" width="2" height="1" fill="#94a3b8"/>
    <rect x="21" y="6" width="1" height="1" fill="#94a3b8"/>
    <rect x="20" y="7" width="2" height="1" fill="#94a3b8"/>
  </g>
  <text x="35" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">idle</text>

  <!-- thinking (dots) -->
  <g transform="translate(69,0)">
    <use href="#b"/>
    <rect x="11" y="9" width="2" height="2" fill="#4ade80"/>
    <rect x="15" y="9" width="2" height="2" fill="#4ade80"/>
    <rect x="19" y="9" width="2" height="2" fill="#4ade80"/>
  </g>
  <text x="85" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">thinking</text>

  <!-- reading (scan) -->
  <g transform="translate(119,0)">
    <use href="#b"/>
    <rect x="10" y="7" width="4" height="3" fill="#4ade80"/>
    <rect x="17" y="7" width="4" height="3" fill="#4ade80"/>
    <rect x="13" y="8" width="1" height="1" fill="#0f172a"/>
    <rect x="20" y="8" width="1" height="1" fill="#0f172a"/>
  </g>
  <text x="135" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">reading</text>

  <!-- editing (focused) -->
  <g transform="translate(169,0)">
    <use href="#b"/>
    <rect x="11" y="7" width="3" height="3" fill="#4ade80"/>
    <rect x="18" y="8" width="3" height="1" fill="#4ade80"/>
    <rect x="13" y="12" width="6" height="1" fill="#4ade80"/>
  </g>
  <text x="185" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">editing</text>

  <!-- running (excited) -->
  <g transform="translate(219,0)">
    <use href="#b"/>
    <rect x="11" y="7" width="3" height="3" fill="#4ade80"/>
    <rect x="18" y="7" width="3" height="3" fill="#4ade80"/>
    <rect x="12" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="19" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="13" y="11" width="6" height="2" fill="#4ade80"/>
    <rect x="14" y="11" width="4" height="1" fill="#0f172a"/>
  </g>
  <text x="235" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">running</text>

  <!-- waiting (question) -->
  <g transform="translate(269,0)">
    <use href="#b"/>
    <rect x="14" y="6" width="4" height="1" fill="#facc15"/>
    <rect x="18" y="7" width="1" height="2" fill="#facc15"/>
    <rect x="15" y="9" width="3" height="1" fill="#facc15"/>
    <rect x="15" y="10" width="1" height="1" fill="#facc15"/>
    <rect x="15" y="12" width="1" height="1" fill="#facc15"/>
  </g>
  <text x="285" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">waiting</text>

  <!-- error (x-eyes) -->
  <g transform="translate(319,0)">
    <use href="#b"/>
    <rect x="11" y="7" width="1" height="1" fill="#f87171"/>
    <rect x="13" y="7" width="1" height="1" fill="#f87171"/>
    <rect x="12" y="8" width="1" height="1" fill="#f87171"/>
    <rect x="11" y="9" width="1" height="1" fill="#f87171"/>
    <rect x="13" y="9" width="1" height="1" fill="#f87171"/>
    <rect x="18" y="7" width="1" height="1" fill="#f87171"/>
    <rect x="20" y="7" width="1" height="1" fill="#f87171"/>
    <rect x="19" y="8" width="1" height="1" fill="#f87171"/>
    <rect x="18" y="9" width="1" height="1" fill="#f87171"/>
    <rect x="20" y="9" width="1" height="1" fill="#f87171"/>
    <rect x="13" y="12" width="6" height="1" fill="#f87171"/>
  </g>
  <text x="335" y="42" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">error</text>
</svg>
