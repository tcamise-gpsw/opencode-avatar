<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Avatar</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { overflow: hidden; background: transparent; }
      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #robot-tooltip {
        position: fixed;
        display: none;
        min-width: 160px;
        max-width: 280px;
        padding: 8px 10px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.94);
        color: #e2e8f0;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.35);
        pointer-events: none;
        white-space: nowrap;
        z-index: 9999;
      }
      #robot-tooltip strong {
        display: block;
        margin-bottom: 2px;
        color: #f8fafc;
        font-weight: 600;
      }
      #robot-tooltip span {
        display: block;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="robot-tooltip" role="tooltip" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
